services:
  - type: web
    name: iotcloud-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iotcloud-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ALLOWED_ORIGIN
        value: "*"

  - type: web
    name: iotcloud-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: iotcloud-api
          property: host

databases:
  - name: iotcloud-db
    plan: free
