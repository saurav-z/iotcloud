services:
  - type: web
    name: iotcloud-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iotcloud-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
  - type: web
    name: iotcloud-web
    runtime: static
    buildCommand: npm install && npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
databases:
  - name: iotcloud-db
    plan: free
